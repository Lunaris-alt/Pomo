<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Super Minimal Cute Pomodoro</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Font: Fredoka (Cute, thick, and rounded) -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">

    <style>
        body {
            background-color: #151515;
            color: #ffffff;
            font-family: 'Fredoka', sans-serif;
            touch-action: manipulation;
            -webkit-tap-highlight-color: transparent;
            user-select: none;
        }

        /* Thick custom SVG stroke styling */
        .thick-stroke {
            stroke-width: 12;
            stroke-linecap: round;
            stroke-linejoin: round;
        }

        /* Playful button animations */
        .cute-btn {
            transition: transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1), background-color 0.2s, color 0.2s;
        }
        .cute-btn:hover {
            transform: scale(1.06);
        }
        .cute-btn:active {
            transform: scale(0.92);
        }

        /* Cute wiggle animation on play/pause or timer state shift */
        @keyframes subtle-bounce {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }
        .animate-bounce-subtle {
            animation: subtle-bounce 2s ease-in-out infinite;
        }

        @keyframes pulse-ring {
            0% { transform: scale(0.98); opacity: 0.8; }
            50% { transform: scale(1.02); opacity: 1; }
            100% { transform: scale(0.98); opacity: 0.8; }
        }
        .animate-pulse-ring {
            animation: pulse-ring 3s ease-in-out infinite;
        }

        /* Circular progress ring smoothly transitioning */
        circle.progress-ring__circle {
            transition: stroke-dashoffset 0.4s cubic-bezier(0.4, 0, 0.2, 1);
            transform: rotate(-90deg);
            transform-origin: 50% 50%;
        }

        /* Custom color theme variables / classes */
        :root {
            --bg-color: #151515;
            --text-color: #ffffff;
            --faded-color: rgba(255, 255, 255, 0.2);
        }

        /* Custom color picker styling */
        input[type="color"] {
            -webkit-appearance: none;
            border: none;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            background: none;
        }
        input[type="color"]::-webkit-color-swatch-wrapper {
            padding: 0;
        }
        input[type="color"]::-webkit-color-swatch {
            border: 3px solid currentColor;
            border-radius: 50%;
        }

        /* Modal animation */
        .modal-enter {
            opacity: 0;
            transform: scale(0.95);
        }
        .modal-enter-active {
            opacity: 1;
            transform: scale(1);
            transition: opacity 0.2s ease, transform 0.2s cubic-bezier(0.34, 1.56, 0.64, 1);
        }

        /* Custom thick tab indicator pills */
        .tab-btn {
            border: 3px solid transparent;
            transition: all 0.25s ease;
        }
        .tab-btn.active {
            background-color: var(--text-color);
            color: var(--bg-color);
        }
        .tab-btn:not(.active):hover {
            border-color: var(--faded-color);
        }
    </style>
</head>
<body id="appBody" class="flex flex-col items-center justify-between min-h-screen p-4 md:p-8 select-none overflow-hidden transition-colors duration-300">

    <header class="w-full max-w-md flex justify-between items-center pt-2">
        <div class="flex items-center space-x-2">
            <!-- Cute Tomato Mini Icon -->
            <svg class="w-8 h-8 stroke-current fill-none thick-stroke" viewBox="0 0 100 100">
                <!-- Leaf stem -->
                <path d="M 50 25 C 45 10, 30 15, 30 15 C 30 15, 45 25, 50 25 C 55 25, 70 15, 70 15 C 70 15, 55 10, 50 25 Z" fill="currentColor" stroke="none" />
                <!-- Body -->
                <circle cx="50" cy="55" r="32" stroke="currentColor" stroke-width="8" fill="none"/>
            </svg>
            <span class="text-2xl font-bold tracking-wide">pomo</span>
        </div>

        <div class="flex items-center space-x-2">
            <!-- Sound Toggle Button -->
            <button id="soundToggleBtn" onclick="toggleSound()" class="cute-btn p-3 rounded-full border-4 border-current hover:opacity-80 focus:outline-none" aria-label="Toggle Sound">
                <!-- Sound On Icon -->
                <svg id="soundOnIcon" class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                    <path d="M19.07 4.93a10 10 0 0 1 0 14.14M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                </svg>
                <!-- Sound Off Icon (Hidden by default) -->
                <svg id="soundOffIcon" class="w-6 h-6 stroke-current fill-none hidden" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="1" y1="1" x2="23" y2="23"></line>
                    <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                </svg>
            </button>

            <!-- Settings Button -->
            <button id="settingsBtn" onclick="openSettings()" class="cute-btn p-3 rounded-full border-4 border-current hover:opacity-80 focus:outline-none" aria-label="Open Settings">
                <svg class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="3" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="3"></circle>
                    <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
                </svg>
            </button>
        </div>
    </header>

    <main class="w-full max-w-md flex flex-col items-center justify-center my-auto space-y-6 md:space-y-8">
        <div class="flex justify-center space-x-2 md:space-x-3 p-2 border-4 border-current rounded-full w-full max-w-xs md:max-w-sm">
            <button onclick="setMode('work')" id="tab-work" class="tab-btn active flex-1 py-2 text-base md:text-lg font-bold rounded-full">focus</button>
            <button onclick="setMode('shortBreak')" id="tab-shortBreak" class="tab-btn flex-1 py-2 text-base md:text-lg font-bold rounded-full">break</button>
            <button onclick="setMode('longBreak')" id="tab-longBreak" class="tab-btn flex-1 py-2 text-base md:text-lg font-bold rounded-full">rest</button>
        </div>

        <div class="relative w-64 h-64 md:w-80 md:h-80 flex items-center justify-center animate-pulse-ring">
            <svg class="w-full h-full transform -rotate-90" viewBox="0 0 240 240">
                <!-- Background Ring -->
                <circle
                    id="bgRing"
                    cx="120"
                    cy="120"
                    r="100"
                    stroke="rgba(255,255,255,0.2)"
                    stroke-width="14"
                    fill="none"
                />
                <!-- Animated Active Progress Ring -->
                <circle
                    id="progressRing"
                    class="progress-ring__circle"
                    cx="120"
                    cy="120"
                    r="100"
                    stroke="currentColor"
                    stroke-width="14"
                    stroke-linecap="round"
                    fill="none"
                    stroke-dasharray="628.318"
                    stroke-dashoffset="0"
                />
            </svg>

            <!-- Center Content (Timer + Cute Status Face) -->
            <div class="absolute inset-0 flex flex-col items-center justify-center space-y-1">
                <!-- Cute Face Expression -->
                <div id="cuteFace" class="text-2xl md:text-3xl transition-all duration-300 transform hover:scale-125 cursor-pointer" onclick="pokeFace()">
                    (•ᴗ•)
                </div>
                <!-- Digits -->
                <span id="timerDisplay" class="text-5xl md:text-6xl font-bold tracking-wider">25:00</span>
                <!-- Label / Sessions counter -->
                <span id="sessionCount" class="text-xs md:text-sm font-semibold tracking-widest opacity-80 uppercase">session #1</span>
            </div>
        </div>

        <div class="flex items-center space-x-4 md:space-x-6">
            <!-- Reset Button -->
            <button onclick="resetTimer()" class="cute-btn p-4 rounded-full border-4 border-current text-current hover:opacity-80 focus:outline-none" title="Reset Timer">
                <svg class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M21.5 2v6h-6M21.34 15.57a10 10 0 1 1-.57-8.38l5.67-5.67"/>
                </svg>
            </button>

            <!-- Play / Pause Main Action Button -->
            <button id="playBtn" onclick="toggleTimer()" class="cute-btn px-8 py-4 bg-current rounded-full border-4 border-current text-2xl font-bold flex items-center justify-center space-x-2 shadow-lg min-w-[140px]">
                <span id="playBtnText" class="text-bg-color">start</span>
            </button>

            <!-- Skip Button -->
            <button onclick="skipTimer()" class="cute-btn p-4 rounded-full border-4 border-current text-current hover:opacity-80 focus:outline-none" title="Skip Session">
                <svg class="w-6 h-6 stroke-current fill-none" viewBox="0 0 24 24" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round">
                    <polygon points="5 4 15 12 5 20 5 4"></polygon>
                    <line x1="19" y1="5" x2="19" y2="19"></line>
                </svg>
            </button>
        </div>
    </main>

    <div id="settingsModal" class="fixed inset-0 bg-black/60 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div id="modalContent" class="w-full max-w-sm rounded-3xl p-6 border-4 border-current shadow-2xl space-y-6 text-current modal-enter" style="background-color: var(--bg-color);">
            
            <div class="flex justify-between items-center border-b-4 border-current pb-3">
                <h2 class="text-2xl font-bold tracking-wide">settings</h2>
                <button onclick="closeSettings()" class="cute-btn p-1 rounded-full text-current hover:opacity-70 focus:outline-none">
                    <svg class="w-7 h-7 stroke-current" viewBox="0 0 24 24" stroke-width="3.5" stroke-linecap="round">
                        <line x1="18" y1="6" x2="6" y2="18"></line>
                        <line x1="6" y1="6" x2="18" y2="18"></line>
                    </svg>
                </button>
            </div>

            <!-- Timer Duration Inputs -->
            <div class="space-y-4">
                <h3 class="text-xs uppercase font-bold tracking-widest opacity-60">time (minutes)</h3>
                <div class="grid grid-cols-3 gap-3">
                    <div class="flex flex-col items-center p-2 rounded-2xl border-2 border-current">
                        <label class="text-xs font-semibold mb-1">focus</label>
                        <input type="number" id="inputWork" min="1" max="120" class="w-full text-center text-xl font-bold bg-transparent border-none focus:outline-none" value="25">
                    </div>
                    <div class="flex flex-col items-center p-2 rounded-2xl border-2 border-current">
                        <label class="text-xs font-semibold mb-1">break</label>
                        <input type="number" id="inputShort" min="1" max="60" class="w-full text-center text-xl font-bold bg-transparent border-none focus:outline-none" value="5">
                    </div>
                    <div class="flex flex-col items-center p-2 rounded-2xl border-2 border-current">
                        <label class="text-xs font-semibold mb-1">rest</label>
                        <input type="number" id="inputLong" min="1" max="60" class="w-full text-center text-xl font-bold bg-transparent border-none focus:outline-none" value="15">
                    </div>
                </div>
            </div>

            <!-- Color Theme Customizer -->
            <div class="space-y-4">
                <div class="flex justify-between items-center">
                    <h3 class="text-xs uppercase font-bold tracking-widest opacity-60">theme colors</h3>
                    <button onclick="resetColors()" class="text-xs underline opacity-70 hover:opacity-100 font-semibold">reset theme</button>
                </div>
                
                <div class="space-y-3">
                    <!-- Primary Color -->
                    <div class="flex items-center justify-between p-2 rounded-2xl border-2 border-current">
                        <span class="text-sm font-bold">Primary (Background)</span>
                        <input type="color" id="primaryPicker" value="#151515" onchange="applyCustomTheme()">
                    </div>

                    <!-- Secondary Color -->
                    <div class="flex items-center justify-between p-2 rounded-2xl border-2 border-current">
                        <span class="text-sm font-bold">Secondary (Text & Bar)</span>
                        <input type="color" id="secondaryPicker" value="#ffffff" onchange="applyCustomTheme()">
                    </div>

                    <!-- Tertiary Color -->
                    <div class="flex items-center justify-between p-2 rounded-2xl border-2 border-current">
                        <span class="text-sm font-bold">Tertiary (Faded/Empty)</span>
                        <input type="color" id="tertiaryPicker" value="#444444" onchange="applyCustomTheme()">
                    </div>
                </div>
            </div>

            <!-- Save & Close Action -->
            <button onclick="saveSettings()" class="cute-btn w-full py-3 rounded-full font-bold text-lg bg-current shadow-md flex justify-center items-center">
                <span class="text-bg-color">save changes</span>
            </button>
        </div>
    </div>

    <footer class="w-full max-w-md flex flex-col items-center space-y-3 pb-2">
        <div id="dotsContainer" class="flex items-center justify-center space-x-2">
            <!-- Session dots injected dynamically -->
        </div>
        <p class="text-xs font-semibold opacity-40">keep it simple • stay focused</p>
    </footer>

    <script>
        // Timer settings in seconds (editable in settings)
        let SETTINGS = {
            work: 25 * 60,
            shortBreak: 5 * 60,
            longBreak: 15 * 60
        };

        const FACES = {
            idleWork: "(•ᴗ•)",
            runningWork: "( ˆoˆ )",
            idleBreak: "( ˘ω˘ )",
            runningBreak: "(★ω★)",
            finished: "(🎉•̀ᴗ•́)🎉",
            poked: "(> ‿ <)"
        };

        let currentMode = 'work'; // 'work', 'shortBreak', 'longBreak'
        let timeLeft = SETTINGS.work;
        let timerInterval = null;
        let isRunning = false;
        let completedWorkSessions = 0;
        let soundEnabled = true;

        // Color theme object
        let customTheme = {
            primary: '#151515',
            secondary: '#ffffff',
            tertiary: '#444444'
        };

        // DOM Elements
        const timerDisplay = document.getElementById('timerDisplay');
        const progressRing = document.getElementById('progressRing');
        const bgRing = document.getElementById('bgRing');
        const playBtnText = document.getElementById('playBtnText');
        const cuteFace = document.getElementById('cuteFace');
        const sessionCount = document.getElementById('sessionCount');
        const dotsContainer = document.getElementById('dotsContainer');
        const soundOnIcon = document.getElementById('soundOnIcon');
        const soundOffIcon = document.getElementById('soundOffIcon');
        const settingsModal = document.getElementById('settingsModal');
        const modalContent = document.getElementById('modalContent');
        const appBody = document.getElementById('appBody');

        const CIRCUMFERENCE = 2 * Math.PI * 100; // Radius = 100

        // Initialize audio context lazily on user gesture
        let audioCtx = null;

        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        function playBeep(type = 'click') {
            if (!soundEnabled) return;
            initAudio();
            if (!audioCtx) return;

            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();
            osc.connect(gain);
            gain.connect(audioCtx.destination);

            const now = audioCtx.currentTime;

            if (type === 'click') {
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, now);
                osc.frequency.exponentialRampToValueAtTime(880, now + 0.08);
                gain.gain.setValueAtTime(0.15, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.08);
                osc.start(now);
                osc.stop(now + 0.08);
            } else if (type === 'finish') {
                const notes = [523.25, 659.25, 783.99, 1046.50];
                notes.forEach((freq, idx) => {
                    const o = audioCtx.createOscillator();
                    const g = audioCtx.createGain();
                    o.connect(g);
                    g.connect(audioCtx.destination);
                    o.type = 'triangle';
                    o.frequency.setValueAtTime(freq, now + idx * 0.12);
                    g.gain.setValueAtTime(0.2, now + idx * 0.12);
                    g.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.12 + 0.25);
                    o.start(now + idx * 0.12);
                    o.stop(now + idx * 0.12 + 0.25);
                });
            }
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            if (soundEnabled) {
                soundOnIcon.classList.remove('hidden');
                soundOffIcon.classList.add('hidden');
                playBeep('click');
            } else {
                soundOnIcon.classList.add('hidden');
                soundOffIcon.classList.remove('hidden');
            }
        }

        function updateProgress() {
            const total = SETTINGS[currentMode];
            const fraction = timeLeft / total;
            const offset = CIRCUMFERENCE * (1 - fraction);
            progressRing.style.strokeDashoffset = offset;

            const mins = Math.floor(timeLeft / 60);
            const secs = timeLeft % 60;
            const formatted = `${String(mins).padStart(2, '0')}:${String(secs).padStart(2, '0')}`;
            
            timerDisplay.textContent = formatted;
            document.title = `${formatted} - ${currentMode === 'work' ? 'Focus' : 'Break'}`;
        }

        function updateFace() {
            if (isRunning) {
                cuteFace.textContent = currentMode === 'work' ? FACES.runningWork : FACES.runningBreak;
            } else {
                cuteFace.textContent = currentMode === 'work' ? FACES.idleWork : FACES.idleBreak;
            }
        }

        function pokeFace() {
            playBeep('click');
            const prevFace = cuteFace.textContent;
            cuteFace.textContent = FACES.poked;
            cuteFace.classList.add('scale-125');
            setTimeout(() => {
                cuteFace.classList.remove('scale-125');
                updateFace();
            }, 600);
        }

        function renderSessionDots() {
            dotsContainer.innerHTML = '';
            for (let i = 0; i < 4; i++) {
                const dot = document.createElement('div');
                const isFilled = i < (completedWorkSessions % 4);
                dot.className = `w-4 h-4 rounded-full border-3 border-current transition-all duration-300`;
                dot.style.backgroundColor = isFilled ? 'currentColor' : 'transparent';
                dotsContainer.appendChild(dot);
            }
        }

        function setMode(mode) {
            playBeep('click');
            currentMode = mode;
            pauseTimer();
            timeLeft = SETTINGS[mode];

            ['work', 'shortBreak', 'longBreak'].forEach(m => {
                const btn = document.getElementById(`tab-${m}`);
                if (m === mode) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });

            if (mode === 'work') {
                sessionCount.textContent = `session #${(completedWorkSessions % 4) + 1}`;
            } else if (mode === 'shortBreak') {
                sessionCount.textContent = 'short break';
            } else {
                sessionCount.textContent = 'long break';
            }

            updateProgress();
            updateFace();
        }

        function toggleTimer() {
            playBeep('click');
            if (isRunning) {
                pauseTimer();
            } else {
                startTimer();
            }
        }

        function startTimer() {
            if (isRunning) return;
            initAudio();
            isRunning = true;
            playBtnText.textContent = 'pause';
            updateFace();

            timerInterval = setInterval(() => {
                if (timeLeft > 0) {
                    timeLeft--;
                    updateProgress();
                } else {
                    onTimerFinished();
                }
            }, 1000);
        }

        function pauseTimer() {
            isRunning = false;
            clearInterval(timerInterval);
            playBtnText.textContent = 'start';
            updateFace();
        }

        function resetTimer() {
            playBeep('click');
            pauseTimer();
            timeLeft = SETTINGS[currentMode];
            updateProgress();
        }

        function skipTimer() {
            playBeep('click');
            pauseTimer();
            switchNextMode();
        }

        function onTimerFinished() {
            pauseTimer();
            playBeep('finish');
            cuteFace.textContent = FACES.finished;

            if (currentMode === 'work') {
                completedWorkSessions++;
                renderSessionDots();
                if (completedWorkSessions % 4 === 0) {
                    setMode('longBreak');
                } else {
                    setMode('shortBreak');
                }
            } else {
                setMode('work');
            }
        }

        function switchNextMode() {
            if (currentMode === 'work') {
                setMode('shortBreak');
            } else {
                setMode('work');
            }
        }

        /* Settings Modal Operations */
        function openSettings() {
            playBeep('click');
            pauseTimer();

            // Populate current values
            document.getElementById('inputWork').value = SETTINGS.work / 60;
            document.getElementById('inputShort').value = SETTINGS.shortBreak / 60;
            document.getElementById('inputLong').value = SETTINGS.longBreak / 60;

            document.getElementById('primaryPicker').value = customTheme.primary;
            document.getElementById('secondaryPicker').value = customTheme.secondary;
            document.getElementById('tertiaryPicker').value = customTheme.tertiary;

            settingsModal.classList.remove('hidden');
            modalContent.classList.add('modal-enter-active');
        }

        function closeSettings() {
            playBeep('click');
            settingsModal.classList.add('hidden');
            modalContent.classList.remove('modal-enter-active');
        }

        function applyCustomTheme() {
            customTheme.primary = document.getElementById('primaryPicker').value;
            customTheme.secondary = document.getElementById('secondaryPicker').value;
            customTheme.tertiary = document.getElementById('tertiaryPicker').value;

            // Apply style rules dynamically
            document.documentElement.style.setProperty('--bg-color', customTheme.primary);
            document.documentElement.style.setProperty('--text-color', customTheme.secondary);
            document.documentElement.style.setProperty('--faded-color', customTheme.tertiary);

            appBody.style.backgroundColor = customTheme.primary;
            appBody.style.color = customTheme.secondary;

            bgRing.setAttribute('stroke', customTheme.tertiary);

            // Update elements relying on reverse text colors
            document.querySelectorAll('.text-bg-color').forEach(el => {
                el.style.color = customTheme.primary;
            });
        }

        function resetColors() {
            playBeep('click');
            document.getElementById('primaryPicker').value = '#151515';
            document.getElementById('secondaryPicker').value = '#ffffff';
            document.getElementById('tertiaryPicker').value = '#444444';
            applyCustomTheme();
        }

        function saveSettings() {
            playBeep('click');

            const w = parseInt(document.getElementById('inputWork').value) || 25;
            const s = parseInt(document.getElementById('inputShort').value) || 5;
            const l = parseInt(document.getElementById('inputLong').value) || 15;

            SETTINGS.work = Math.max(1, w) * 60;
            SETTINGS.shortBreak = Math.max(1, s) * 60;
            SETTINGS.longBreak = Math.max(1, l) * 60;

            applyCustomTheme();
            resetTimer();
            closeSettings();
        }

        // Keyboard navigation spacebar support
        document.addEventListener('keydown', (e) => {
            if (e.code === 'Space' && settingsModal.classList.contains('hidden')) {
                e.preventDefault();
                toggleTimer();
            } else if (e.code === 'Escape' && !settingsModal.classList.contains('hidden')) {
                closeSettings();
            }
        });

        // Initial setup on window load
        window.onload = function() {
            progressRing.style.strokeDasharray = `${CIRCUMFERENCE}`;
            applyCustomTheme();
            updateProgress();
            renderSessionDots();
            updateFace();
        };
    </script>
</body>
</html>
